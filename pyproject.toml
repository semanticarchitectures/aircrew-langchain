[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airdrop-alpha-langgraph"
version = "0.1.0"
description = "Operation AIRDROP ALPHA multi-agent mission simulation on LangChain + LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4,<2",
    "langgraph>=1.2,<2",
    "langchain-anthropic>=1.7,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langsmith>=0.14",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
studio = ["langgraph-cli[inmem]"]

[project.scripts]
airdrop = "airdrop_alpha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/airdrop_alpha"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
